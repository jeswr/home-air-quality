name: Collect air quality
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: air-quality-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: collector
      - name: Collect and store readings
        run: node collector/run.mjs
        env:
          SITE_URL: https://home-air-quality.jmwright-045.chatgpt.site
          SITE_BEARER: ${{ secrets.SITE_BEARER }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
